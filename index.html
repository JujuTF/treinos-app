<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Treinos">
    <title>Treinos App</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230F766E'/><polygon points='58,8 33,52 50,52 38,92 67,48 50,48' fill='white'/></svg>">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
</head>
<body>

<!-- HEADER -->
<header class="header">
    <h1 id="header-titulo">Hoje</h1>
    <div class="header-acoes">
        <span class="header-data" id="header-data"></span>
        <button class="icon-btn" onclick="fazerLogout()" title="Sair" aria-label="Sair">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
        </button>
    </div>
</header>

<!-- ============================
     DASHBOARD
============================ -->
<section class="page active" id="page-dashboard">

    <!-- Ciclo (respeita o modo discreto) -->
    <div class="hero" id="card-ciclo">
        <div class="hero-topo">
            <span class="hero-rotulo">Ciclo menstrual</span>
            <span id="ciclo-fase"></span>
        </div>
        <div id="ciclo-info">
            <span class="hero-texto">A carregar...</span>
        </div>
    </div>

    <!-- Ações rápidas -->
    <div class="acoes">
        <button type="button" class="acao primaria" id="acao-treino" onclick="abrirTreino()">
            <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>
            Treinei hoje
        </button>
        <button type="button" class="acao" id="acao-nota" onclick="focarNota()">
            <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            Nota
        </button>
        <button type="button" class="acao" id="acao-agua" onclick="addAgua(250)" aria-label="Água, somar 250 ml">
            <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 2.7s6 6.3 6 10.8a6 6 0 01-12 0c0-4.5 6-10.8 6-10.8z"/></svg>
            Água
        </button>
    </div>

    <!-- Conquistas de hoje (treino, água, suplementos) -->
    <div class="card conq" id="card-conquistas">
        <div class="card-titulo">Conquistas de hoje</div>
        <div class="conq-itens" id="conq-itens"></div>
        <div class="conq-combo" id="conq-combo"></div>
    </div>

    <!-- Treino registado hoje (só aparece depois de registar) -->
    <div id="treino-hoje" style="margin-bottom:14px;" hidden></div>

    <!-- Esta semana -->
    <div id="resumo-semana"></div>

    <!-- Hidratação -->
    <div class="card">
        <div class="agua">
            <div id="agua-anel-wrap"></div>
            <div class="agua-info">
                <div class="agua-topo">
                    <div class="card-titulo">Hidratação</div>
                    <button type="button" class="link-suave" onclick="resetAgua()">Repor</button>
                </div>
                <div class="agua-ml"><span id="agua-atual">0</span> de <span id="agua-meta-label">2000</span> ml</div>
                <div class="agua-botoes">
                    <button type="button" class="pill" onclick="addAgua(200)">+200</button>
                    <button type="button" class="pill" onclick="addAgua(250)">+250</button>
                    <button type="button" class="pill" onclick="addAgua(500)">+500</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Notas -->
    <div class="card" id="notas-card">
        <div class="card-titulo">Notas</div>
        <div class="nota-nova">
            <input type="text" id="nota-input" maxlength="500" placeholder="Escreve uma nota..." enterkeyhint="done" autocomplete="off">
            <button type="button" onclick="adicionarNota()" aria-label="Adicionar nota">+</button>
        </div>
        <div id="notas-lista"></div>
        <a class="nota-link" href="notas.html">Ver todas</a>
    </div>

</section>

<nav class="nav-bottom">
    <a class="nav-item active" href="index.html">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Hoje
    </a>
    <a class="nav-item" href="ciclo.html">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
        </svg>
        Ciclo
    </a>
    <a class="nav-item" href="stats.html">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        Insights
    </a>
    <a class="nav-item" href="corpo.html">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        Corpo
    </a>
</nav>

<!-- FOLHA — TREINEI HOJE -->
<div class="modal-overlay" id="modal-treino">
    <div class="modal">
        <div class="modal-titulo">Treinei hoje</div>

        <div class="form-grupo">
            <label>Duração (opcional)</label>
            <div class="chips" id="chips-duracao">
                <button type="button" class="chip" data-min="10">10 min</button>
                <button type="button" class="chip" data-min="15">15 min</button>
                <button type="button" class="chip" data-min="30">30 min</button>
                <button type="button" class="chip" data-min="45">45 min</button>
                <button type="button" class="chip" data-min="60">60 min</button>
            </div>
        </div>

        <div class="form-grupo">
            <label>Tipo</label>
            <div class="chips" id="chips-tipo">
                <button type="button" class="chip sel" data-tipo="Treino">Treino</button>
                <button type="button" class="chip" data-tipo="Caminhada">Caminhada</button>
                <button type="button" class="chip" data-tipo="Mobilidade">Mobilidade</button>
            </div>
        </div>

        <div style="display:flex; gap:10px;">
            <button class="btn btn-secundario" style="flex:1;" onclick="fecharTreino()">Cancelar</button>
            <button class="btn btn-primario" style="flex:2;" onclick="guardarTreino()">Guardar</button>
        </div>
    </div>
</div>

<!-- CONFIRMAÇÃO -->
<div class="modal-overlay" id="modal-confirmar">
    <div class="modal">
        <div class="modal-titulo" id="confirmar-titulo"></div>
        <p id="confirmar-texto" style="font-size:15px; color:var(--tx2); margin-bottom:18px;"></p>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-secundario" style="flex:1;" onclick="responderConfirmacao(false)">Cancelar</button>
            <button class="btn btn-primario" style="flex:2;" id="confirmar-ok" onclick="responderConfirmacao(true)">Confirmar</button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- DEPLOY INFO -->
<div id="deploy-info" style="text-align:center; padding: 8px; color: var(--tx2); font-size: 12px; margin-bottom: 4px;"></div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/ciclo-calc.js"></script>
<script src="js/discreto.js"></script>
<script src="js/ui.js"></script>
<script src="js/treino-calc.js"></script>
<script src="js/conquistas.js"></script>
<script src="js/app.js"></script>

</body>
</html>
